# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboshop-frontend
  namespace: roboshop
spec:
  replicas: 1 # Cost optimized: 1 replica instead of 3
  selector:
    matchLabels:
      app: roboshop-frontend
  template:
    metadata:
      labels:
        app: roboshop-frontend
    spec:
      containers:
      - name: roboshop-frontend
        image: ruthvikk1214/roboshop-frontend:1.0 # UPDATE THIS
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: roboshop-frontend
  namespace: roboshop
spec:
  type: NodePort
  selector:
    app: roboshop-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---

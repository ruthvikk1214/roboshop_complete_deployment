name: Roboshop CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Enables manual trigger from the Actions tab

jobs:
  # Stage 1: Static Code Analysis
  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true # Ignore vulnerabilities as requested

  # Stage 2: Image Vulnerability Scanning
  trivy:
    name: Trivy Vulnerability Scan
    needs: sonarqube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ruthvikk1214/roboshop-frontend:1.0' # Example image
          format: 'table'
          exit-code: '0' # Ensures the pipeline does NOT fail regardless of vulnerabilities
          severity: 'CRITICAL,HIGH'
        continue-on-error: true # Extra layer of safety to ensure the pipeline proceeds

  # Stage 3: Infrastructure Security Scanning
  tfsec:
    name: Terraform Security Scan (Checkov)
    needs: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
        continue-on-error: true # Ignore vulnerabilities

  # Stage 4: Validation and Planning
  tf_validate_plan:
    name: Terraform Validate & Plan
    needs: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infrastructure init

      - name: Terraform Validate
        run: terraform -chdir=infrastructure validate

      - name: Terraform Plan
        run: |
          echo "Checking EKS version in file..."
          grep "version" infrastructure/eks/main.tf
          echo "Checking VPC CIDR in file..."
          grep "vpc_cidr" infrastructure/variables.tf
          terraform -chdir=infrastructure plan -out=tfplan -lock=false

  # Stage 5: Manual Approval and Apply
  # In GitHub Actions, manual gates are handled via "Environments" and "Required Reviewers"
  deploy:
    name: Deploy Infrastructure & App
    needs: tf_validate_plan
    runs-on: ubuntu-latest
    environment: production # This enables the manual approval gate in GitHub settings
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infrastructure init

      - name: Terraform Apply
        run: terraform -chdir=infrastructure apply -auto-approve -lock=false

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name prod-roboshop-eks

      - name: Install AWS Load Balancer Controller
        run: |
          # Install Helm
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # Add EKS Helm chart repo
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          # Install the AWS Load Balancer Controller
          # Note: For production, create a dedicated IAM role with IRSA
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=prod-roboshop-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=${{ secrets.AWS_REGION }} \
            --set vpcId=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=prod-roboshop-vpc" --query "Vpcs[0].VpcId" --output text)

          # Wait for controller to be ready
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/databases.yaml
          sleep 15
          kubectl apply -f k8s/base/deployments.yaml
          kubectl apply -f k8s/base/ingress.yaml
# Stage 6: ExternalDNS - Sync ALB DNS to Route53
  external-dns:
    name: Sync DNS Records
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name prod-roboshop-eks

      - name: Install ExternalDNS (pinned release)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/external-dns/releases/download/v0.13.2/external-dns.yaml

      - name: Wait for ExternalDNS rollout
        run: |
          kubectl rollout status deployment/external-dns -n kube-system --timeout=120s

      - name: Configure ExternalDNS for Roboshop
        run: |
          kubectl patch deployment external-dns -n kube-system --type=merge -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"external-dns","args":["--source=ingress","--target-type=CNAME","--domain-filter=rk1214.in","--policy=upsert-only","--registry=txt","--txt-owner-id=roboshop-eks"]}]}}}}'

      - name: Verify Ingress status
        run: |
          kubectl get ingress -n roboshop
          echo "Confirm roboshop.rk1214.in CNAME appears in Route53 hosted zone rk1214.in"
